name: Verify public HMDA results

on:
  push:
    branches: [main]
    paths:
      - 'results/**'
      - 'R/verify_public_results.R'
      - 'R/verify_feature_inventory.R'
      - 'docs/dti_excluded_seed101_feature_names.csv'
      - '.github/workflows/verify-public-results.yml'
  pull_request:
    paths:
      - 'results/**'
      - 'R/verify_public_results.R'
      - '.github/workflows/verify-public-results.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-aggregate-tables:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false
      - name: Verify public aggregate results
        run: |
          Rscript R/verify_public_results.R
          Rscript R/verify_feature_inventory.R
